# Full stack locally: Postgres + pgvector, the API and the web app.
#   cp .env.example .env   (set SECRET_KEY and, optionally, LLM_API_KEY)
#   docker compose up --build
# Web app: http://localhost:3000   API docs: http://localhost:8000/docs

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pagewise
      POSTGRES_PASSWORD: pagewise
      POSTGRES_DB: pagewise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagewise"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pagewise:pagewise@db:5432/pagewise
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
