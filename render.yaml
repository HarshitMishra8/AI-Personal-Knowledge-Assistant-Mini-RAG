# Render Blueprint for the API (free plan). The web app goes on Vercel and the database on Neon.
# Render dashboard -> New -> Blueprint -> pick this repo, then fill in the values marked sync: false.
services:
  - type: web
    name: pagewise-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://pagewise.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false # optional, for Vercel preview URLs
